[...new Set(peliculas.map(p=>p.group).filter(Boolean))].sort().forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;grupos.appendChild(o)});
function render(){const q=buscar.value.trim().toLocaleLowerCase('es'),g=grupos.value;const lista=peliculas.filter(p=>p.title.toLocaleLowerCase('es').includes(q)&&(!g||p.group===g));catalogo.replaceChildren();lista.forEach(p=>{const card=document.createElement('article');card.className='card';if(p.logo){const img=document.createElement('img');img.className='poster';img.loading='lazy';img.src=p.logo;img.alt='';img.onerror=()=>{const n=document.createElement('div');n.className='noPoster';n.textContent='🎬';img.replaceWith(n)};card.appendChild(img)}else{const n=document.createElement('div');n.className='noPoster';n.textContent='🎬';card.appendChild(n)}const t=document.createElement('div');t.className='titulo';t.textContent=p.title;card.appendChild(t);const gr=document.createElement('div');gr.className='grupo';gr.textContent=p.group||'';card.appendChild(gr);const b=document.createElement('button');b.className='boton';b.type='button';b.textContent='▶ Reproducir aquí';b.addEventListener('click',()=>ver(p));card.appendChild(b);catalogo.appendChild(card)});estado.textContent=`${lista.length} de ${peliculas.length} elementos del catálogo`}
function ver(p){if(!p.url||!/^https?:/i.test(p.url)){mensaje.textContent='Este elemento no es una película reproducible.';return}document.getElementById('tituloVideo').textContent=p.title;modal.style.display='block';mensaje.textContent='Intentando reproducir dentro de ORIX TV…';video.pause();video.removeAttribute('src');video.load();video.src=p.url;video.muted=false;video.volume=1;video.play().then(()=>{mensaje.textContent='Reproducción iniciada. El sonido está activado; ajustalo desde los controles del video.'}).catch(()=>{mensaje.textContent='El navegador no pudo reproducir este archivo. Los enlaces de este catálogo son MKV por HTTP: muchos navegadores Android no admiten MKV directamente y una página HTTPS puede bloquear enlaces HTTP. Para reproducir dentro de ORIX, el servidor debe ofrecer el video en un formato compatible (por ejemplo MP4/H.264 o HLS) mediante HTTPS.'})}
function cerrar(){video.pause();video.removeAttribute('src');video.load();modal.style.display='none'}
buscar.addEventListener('input',render);grupos.addEventListener('change',render);document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar()});modal.addEventListener('click',e=>{if(e.target===modal)cerrar()});render();
</script></body></html>
